services:
  workbench:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8099}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
